# =============================================================================
# Dependabot Configuration
# =============================================================================
# Monitors npm dependencies and GitHub Actions versions.
# Combined with dependabot-maintenance.yml for auto-merge. Schedule:
# Sunday 18:00 UTC, this repository's auto-merge step (automation-templates
# docs/workflows/docker-maintenance.md).
# =============================================================================

version: 2

updates:

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "18:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    commit-message:
      prefix: "chore(ci)"

  # NPM dependency updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "18:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "npm"
      - "dependabot"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Every patch and minor update in one PR per run, which the auto-merge
      # caller (dependabot-maintenance.yml) merges once nodejs-pr.yml passed.
      # n8n-core and n8n-workflow are published in lock-step and both pin the
      # same exact zod peer (e.g. zod@3.25.76). Bumping one without the other
      # fails `npm ci` with ERESOLVE; inside this catch-all group they still
      # move together, and their majors stay ignored below.
      # 0.x packages are excluded: below 1.0.0 a minor counts as major for
      # the auto-merge gate, would turn the whole group major and hold it
      # open. They arrive as PRs of their own and wait for review. Remove a
      # package from exclude-patterns once it reaches 1.0.
      npm-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@n8n/scan-community-package"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # n8n 3.x libraries are only on the npm `rc` dist-tag; the n8n app
      # (latest 2.48.x) still ships n8n-workflow 2.x, which is what this node
      # runs against. Remove once n8n 3.0 is released as `latest`.
      - dependency-name: "n8n-core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "n8n-workflow"
        update-types: ["version-update:semver-major"]
      # ts-jest (latest 29.4.15) peers typescript <7 and does not support
      # the TypeScript 7 native compiler API. Remove once it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
